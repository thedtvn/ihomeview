[package]
name = "ihomeview"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
nsh-core = "=0.6.0"
nsh-base = "=0.6.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Experimental Spotify Connect remote (see src/spotify/README.md).
# The whole librespot workspace from the fantasybot-red fork: upstream `dev` + one commit that makes
# librespot identify as macOS on iOS (Spotify refuses the iOS identity with TryAnotherAP).
librespot = { git = "https://github.com/fantasybot-red/librespot", branch = "dev" }
protobuf = "3.7"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", default-features = false, features = ["net", "io-util", "time", "rt", "macros", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json"] }
serde_json = "1"
base64 = "0.22"
rand = "0.8"
hex = "0.4"
log = "0.4"
# Pinned here, not only in Cargo.lock, because `nsh package` resolves a fresh lockfile.
# librespot's sysinfo 0.36 calls libc::proc_pidinfo on iOS; libc >= 0.2.190 limits it to macOS.
libc = "=0.2.189"

[dev-dependencies]
nsh-engine = "=0.6.0"
nsh-testing = "=0.6.0"

[profile.release]
lto = "thin"
strip = "debuginfo"

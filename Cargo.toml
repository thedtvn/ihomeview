[package]
name = "ihomeview"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
nsh-core = "=0.6.0"
nsh-base = "=0.6.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Experimental Spotify Connect remote (see src/spotify/README.md). No playback/audio crates.
# librespot from GitHub `dev`, pinned to one commit for reproducible builds.
librespot-core = { git = "https://github.com/librespot-org/librespot", rev = "15e02e86c72d96dd39d548e3749f00abe39ffdde", default-features = false, features = ["native-tls"] }
librespot-protocol = { git = "https://github.com/librespot-org/librespot", rev = "15e02e86c72d96dd39d548e3749f00abe39ffdde" }
protobuf = "3.7"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", default-features = false, features = ["net", "io-util", "time", "rt", "macros", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json"] }
serde_json = "1"
base64 = "0.22"
rand = "0.8"
hex = "0.4"
log = "0.4"
# Pinned here, not only in Cargo.lock, because `nsh package` resolves a fresh lockfile.
# librespot's sysinfo 0.36 calls libc::proc_pidinfo on iOS; libc >= 0.2.190 limits it to macOS.
libc = "=0.2.189"

[dev-dependencies]
nsh-engine = "=0.6.0"
nsh-testing = "=0.6.0"

[profile.release]
lto = "thin"
strip = "debuginfo"
